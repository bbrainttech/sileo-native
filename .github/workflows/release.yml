name: Release
on:
  push:
    branches:
      - main

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  # npm trusted publishing: the registry trusts this workflow, no token needed
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup
        uses: ./.github/actions/setup

      # A merge only publishes when the version is new, so merges that
      # change only the site or the example go out without a release.
      - name: Check version
        id: version
        working-directory: packages/sileo-native
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if npm view "sileo-native@$VERSION" version > /dev/null 2>&1; then
            echo "sileo-native@$VERSION is already on npm, nothing to publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run unit tests
        if: steps.version.outputs.publish == 'true'
        run: yarn test

      - name: Build package
        if: steps.version.outputs.publish == 'true'
        run: yarn build

      - name: Publish to npm
        if: steps.version.outputs.publish == 'true'
        working-directory: packages/sileo-native
        run: npm publish --access public --ignore-scripts

      - name: Create GitHub release
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.version.outputs.version }}" \
            --target "$GITHUB_SHA" \
            --title "v${{ steps.version.outputs.version }}" \
            --generate-notes
